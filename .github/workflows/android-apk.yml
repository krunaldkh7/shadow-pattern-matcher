# Builds an installable Android APK on every push to main (or on demand from
# the Actions tab) and publishes it as a GitHub Release you can download on
# your phone.
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate app icons
        run: |
          pip install pillow
          python3 scripts/make_icons.py

      # Versions are pinned exactly in package.json.
      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Typecheck and puzzle self-tests
        run: |
          npx tsc --noEmit
          npm run -s verify

      - name: Generate the Android project
        run: npx expo prebuild -p android --no-install
        env:
          CI: 1

      - name: Build release APK
        working-directory: android
        # 64-bit and 32-bit ARM cover practically every Android phone and keep the APK small.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk ShadowPatternMatcher.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Shadow Pattern Matcher (build ${{ github.run_number }})
          body: |
            Test build from commit ${{ github.sha }}.
            Download ShadowPatternMatcher.apk on your Android phone and open it to install.
            Signed with the debug key: for testing only, not for the Play Store.
          files: ShadowPatternMatcher.apk
          make_latest: true
